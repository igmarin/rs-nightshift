[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# Match `rust-version` in Cargo.toml and `rust` in .mise.toml so release
# binaries are built with the same toolchain as CI.
rust-toolchain-version = "1.88.0"
# CI-equivalent gate (fmt, clippy, test, coverage) that must pass before any
# release artifact is built. See .github/workflows/release-checks.yml.
plan-jobs = ["./release-checks"]
# No crates.io publish: this is a binary-only release.
publish-jobs = []

# Keep generated GitHub Actions pinned to commit SHAs.
[dist.github-action-commits]
"actions/checkout" = "d23441a48e516b6c34aea4fa41551a30e30af803"        # v6.1.0
"actions/upload-artifact" = "043fb46d1a93c77aae656e7c1c64a875d1fc6a0a"  # v7.0.1
"actions/download-artifact" = "3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c" # v8.0.1
