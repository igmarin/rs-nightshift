name: ocr PR Review

# Same setup as Ludavela: OpenAI gpt-6-luna over the Responses API, posting with
# the workflow's own token. One review per PR, not one per push: `synchronize`
# fires on every commit and burns Actions minutes and API spend. The pre-commit
# hook covers the commits in between. To review the current head after new
# pushes, toggle the PR to draft and back (`gh pr ready --undo && gh pr ready`).
# Re-running a finished job does NOT help: it reviews the commit it first ran on.
on:
  pull_request:
    types: [opened, ready_for_review]

permissions:
  contents: read
  # The summary is an issue comment on the PR; the findings are review comments.
  issues: write
  pull-requests: write

concurrency:
  group: ocr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Fork PRs are skipped: GitHub gives them no secrets (no OPENAI_API_KEY) and a
    # read-only token, so the review could neither run nor post. Never switch this
    # to pull_request_target.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The pinned CLI is older than npm latest, so `ocr config` starts a detached
      # npm self-update that removes the binary before `ocr review` runs: exit 127
      # (alibaba/open-code-review#703). Keep the pinned version for the whole job.
      OCR_NO_UPDATE: '1'
    steps:
      # The prompt comes from the base branch, not the PR head: a PR author
      # must not be able to edit the review instructions in their own PR.
      - name: Checkout base branch (for the review prompt)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Load review prompt
        id: prompt
        run: |
          # Random delimiter, so no line in the prompt can close the heredoc early.
          delim="OCR_PROMPT_$(openssl rand -hex 16)"
          {
            echo "text<<$delim"
            cat .github/review-prompt.md
            echo "$delim"
          } >> "$GITHUB_OUTPUT"

      - name: Run ocr review
        uses: alibaba/open-code-review@fabbdb296b0d97e2140ada8d54ca7d6d6d1d7ad4 # v1.12.13
        with:
          # Pinned to the release verified on the runner. Bump deliberately.
          ocr_version: '1.12.13'
          llm_url: https://api.openai.com/v1/responses
          llm_auth_token: ${{ secrets.OPENAI_API_KEY }}
          llm_model: gpt-6-luna
          # Responses API: gpt-6-luna rejects function tools on /v1/chat/completions.
          llm_protocol: openai-responses
          llm_use_anthropic: 'false'
          llm_extra_body: '{}'
          github_token: ${{ github.token }}
          effort: medium
          background: ${{ steps.prompt.outputs.text }}
