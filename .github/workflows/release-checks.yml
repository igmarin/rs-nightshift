name: Release Checks

# Reusable CI-equivalent gate for release.yml: the same fmt / clippy / test /
# coverage checks ci.yml runs on main, pinned to the crate's rust-version.
on:
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: fmt, clippy, test, coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      # Pinned from taiki-e/install-action@v2.85.13.
      - uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1
        with:
          tool: cargo-llvm-cov
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test
      - run: cargo test --doc
      - run: cargo llvm-cov --workspace --fail-under-lines 85
