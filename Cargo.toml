[package]
name = "rs-nightshift"
version = "0.1.0"
edition = "2021"
authors = ["Ismael Marín"]
license = "MIT"
description = "Autonomous local multi-agent software development pipeline harness around Ollama"
repository = "https://github.com/igmarin/rs-nightshift"
readme = "README.md"
rust-version = "1.92"
keywords = ["ollama", "agents", "cli"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "nightshift"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
toml = "0.8"
async-trait = "0.1"
clap = { version = "4.5", features = ["derive", "env"] }
llm-kernel = { version = "0.25", features = ["client-async", "provider", "tokens", "safety"] }
# NOTE: llm-kernel's Cargo.toml hardcodes `reqwest = { features = ["rustls"] }`,
# which pulls in aws-lc-rs (C/C++ build tools required). We use `rustls` here
# to match; `rustls-no-provider` + `ring` would be preferable to avoid the
# native build chain, but Cargo feature unification means llm-kernel's
# `rustls` feature wins regardless. Track upstream:
# https://github.com/epicsagas/llm-kernel/issues (file if missing).
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tempfile = "3.14"
tokio = { version = "1.42", features = ["macros", "rt-multi-thread", "sync"] }
which = "7"

[dev-dependencies]
wiremock = "0.6"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
