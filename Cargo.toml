[package]
name = "rs-nightshift"
version = "0.1.0"
edition = "2021"
authors = ["Ismael Marín"]
license = "MIT"
description = "Autonomous local multi-agent software development pipeline harness around Ollama"
repository = "https://github.com/igmarin/rs-nightshift"
readme = "README.md"
rust-version = "1.82"
keywords = ["ollama", "agents", "cli"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "nightshift"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
tokio = { version = "1.42", features = ["macros", "rt-multi-thread"] }
which = "7"

[dev-dependencies]
wiremock = "0.6"
